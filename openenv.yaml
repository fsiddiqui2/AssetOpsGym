spec_version: 1
name: assetopsgym
version: 0.1.0
type: space
runtime: fastapi
app: assetopsgym.server.app:app
port: 8000
validation:
  reward:
    range: [-1.0, 1.0]
    oracle_tolerance: 0.05
    floor_margin: 0.5
  resources:
    cpu: 2.0
    memory_mb: 4096
    disk_mb: 2048
    episode_timeout_s: 3600.0
  capabilities:
    verifier:
      kind: reward_channel
    # The agent's tool list, read by server/environment.py; boot fails if
    # a name here is not a gym or AssetOpsBench tool. Not exposed:
    # generate_work_order (create_work_order does it in one call),
    # AssetOpsBench's approve_workorder and close_workorder (the planner
    # and technicians are simulated) and its KPI/calendar tools (they
    # read the wall clock).
    declared_tools: [current_time, advance_time, list_alerts, acknowledge_alert,
                     suppress_alert, finish, sites, asset_ids, asset_detail, assets,
                     installed_sensors, measured_sensors, stream_extent, history, latest_reading, sensor_stats,
                     sensor_coverage, list_workorders, get_workorder, get_failure_codes, create_work_order,
                     update_workorder, cancel_workorder, investigate, escalate, defer,
                     assign_technician]
  types:
    tags: [industrial, maintenance, mcp, assetopsbench]
